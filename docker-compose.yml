services:
  dbexplorer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7074:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MySqlConnection=${DBEXPLORER_MYSQL_CONNECTION}
    networks:
      - default
      - smarttracker_net
    restart: unless-stopped

networks:
  default:
  smarttracker_net:
    external: true
    name: customer-deploy_default
